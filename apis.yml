aid: enuma-inc
name: Enuma, Inc.
description: >-
  Enuma, Inc. is a Berkeley, California educational technology company that builds
  award-winning, self-guided digital learning apps for young children, including the
  Todo Math series, Todo Classroom, and the Kitkit School / Enuma Global program.
  Founded by Sooinn Lee and Gunho Lee, Enuma designs research-based, game-like early
  literacy and numeracy experiences that work for all learners, including children with
  special needs and those in low-resource settings. The company co-won the $10M Global
  Learning XPRIZE for its open-source Kitkit School tablet curriculum. Enuma is a consumer
  and classroom education company that ships mobile applications through the Apple App Store
  and Google Play; it does not currently publish a public developer API, SDK, or event
  surface. This profile was surfaced as a 500 Global portfolio company and enriched with
  verified company identity by the API Evangelist pipeline.
